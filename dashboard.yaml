# PitPat treadmill card. In Home Assistant: open a dashboard -> pencil (edit) ->
# Add card -> "Manual" -> paste this whole file -> Save. Built-in cards only.
type: vertical-stack
cards:
  # Speedometer + state + time
  - type: grid
    columns: 2
    square: false
    cards:
      - type: gauge
        entity: sensor.pitpat_treadmill_speed
        name: Speed
        unit: km/h
        min: 0
        max: 6
        needle: true
        segments:
          - from: 0
            color: "#43a047"
          - from: 3.5
            color: "#fb8c00"
          - from: 5
            color: "#e53935"
      - type: vertical-stack
        cards:
          - type: tile
            entity: sensor.pitpat_treadmill_state
            name: State
            icon: mdi:run
            vertical: false
          - type: tile
            entity: sensor.pitpat_treadmill_workout_time
            name: Time
            vertical: false

  # Totals
  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: sensor.pitpat_treadmill_distance
        name: Distance
        vertical: true
      - type: tile
        entity: sensor.pitpat_treadmill_calories
        name: Calories
        vertical: true
      - type: tile
        entity: sensor.pitpat_treadmill_target_speed
        name: Target
        vertical: true

  # Speed slider
  - type: entities
    show_header_toggle: false
    entities:
      - entity: number.pitpat_treadmill_speed_setting
        name: Speed setting

  # Controls: Slower / Start|Pause / Stop / Faster
  - type: grid
    columns: 4
    square: false
    cards:
      - type: tile
        entity: button.pitpat_treadmill_slower
        name: Slower
        icon: mdi:minus
        vertical: true
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.pitpat_treadmill_state
            state: running
        card:
          type: tile
          entity: button.pitpat_treadmill_pause
          name: Pause
          icon: mdi:pause
          color: orange
          vertical: true
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.pitpat_treadmill_state
            state_not: running
        card:
          type: tile
          entity: button.pitpat_treadmill_start
          name: Start
          icon: mdi:play
          color: green
          vertical: true
      - type: tile
        entity: button.pitpat_treadmill_faster
        name: Faster
        icon: mdi:plus
        vertical: true
  - type: tile
    entity: button.pitpat_treadmill_stop
    name: Stop
    icon: mdi:stop
    color: red
    vertical: false

  # Recent speed
  - type: history-graph
    hours_to_show: 1
    entities:
      - entity: sensor.pitpat_treadmill_speed
        name: Speed
      - entity: sensor.pitpat_treadmill_target_speed
        name: Target
